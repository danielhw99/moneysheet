name: BE private images
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: BE-ghcr-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/dev' && github.repository_owner == 'danielhw99'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test publication policy
        run: node --test .github/scripts/ghcr-policy.test.cjs
      - name: Verify exact revision CI and private packages
        uses: actions/github-script@v7
        with:
          script: |
            const policy = require('./.github/scripts/ghcr-policy.cjs');
            await policy.verifyCi(github, context, 'backend-ci.yml');
            await policy.verifyPrivate(github, context, ['moneysheet-be', 'moneysheet-migration'], true);
      - uses: docker/setup-buildx-action@v3
      - name: Build app without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/danielhw99/moneysheet-be:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build migration without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migration
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/danielhw99/moneysheet-migration:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Authenticate only after all builds succeed
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify authenticated digest pulls
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          manifest="$RUNNER_TEMP/release/images.env"
          printf '# revision=%s\n' "$REVISION" > "$manifest"
          image=ghcr.io/danielhw99/moneysheet-be
          docker push "$image:$REVISION"
          digest=$(docker buildx imagetools inspect "$image:$REVISION" --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull "$image@$digest"
          actual=$(docker image inspect "$image@$digest" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          [[ "$actual" == "$REVISION" ]]
          printf 'BE_IMAGE=%s@%s\n' "$image" "$digest" >> "$manifest"
          image=ghcr.io/danielhw99/moneysheet-migration
          docker push "$image:$REVISION"
          digest=$(docker buildx imagetools inspect "$image:$REVISION" --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull "$image@$digest"
          actual=$(docker image inspect "$image@$digest" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          [[ "$actual" == "$REVISION" ]]
          printf 'MIGRATION_IMAGE=%s@%s\n' "$image" "$digest" >> "$manifest"
      - name: Require private visibility after publication
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/ghcr-policy.cjs').verifyPrivate(github, context, ['moneysheet-be', 'moneysheet-migration'], false);
      - name: Record complete release only
        shell: bash
        run: |
          cat "$RUNNER_TEMP/release/images.env" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: be-images-${{ github.sha }}
          path: ${{ runner.temp }}/release/images.env
          if-no-files-found: error
          retention-days: 90
