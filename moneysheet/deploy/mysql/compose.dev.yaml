name: moneysheet-db-dev

services:
  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/moneysheet/preflight.sh"]
    environment:
      MYSQL_DATABASE: moneysheet_dev
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_ROOT_HOST: localhost
      APP_PASSWORD: ${APP_PASSWORD:?required}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?required}
    ports:
      - "127.0.0.1:3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_bin
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./scripts:/opt/moneysheet:ro
    healthcheck:
      test: ["CMD", "/bin/bash", "/opt/moneysheet/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
