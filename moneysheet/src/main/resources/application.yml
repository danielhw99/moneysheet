spring:
  application:
    name: moneysheet
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
    clean-disabled: true
    create-schemas: false
    baseline-on-migrate: false
  sql:
    init:
      mode: never

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.extract: "OFF"
