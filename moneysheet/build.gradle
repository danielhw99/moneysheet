plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.danielhw99'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}


// Migration tooling is isolated from the application runtime and bootJar.
sourceSets {
    migration {}
}

dependencies {
    migrationImplementation 'org.springframework.boot:spring-boot-starter-flyway'
    migrationRuntimeOnly 'org.flywaydb:flyway-mysql'
    migrationRuntimeOnly 'com.mysql:mysql-connector-j'
}

['dbInfo': 'info', 'dbValidate': 'validate', 'dbMigrate': 'migrate'].each { taskName, operation ->
    tasks.register(taskName, JavaExec) {
        group = 'database'
        description = "Run Flyway ${operation} without starting the application"
        classpath = sourceSets.migration.runtimeClasspath
        mainClass = 'com.danielhw99.migration.DatabaseMigration'
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
        args operation
    }
}
